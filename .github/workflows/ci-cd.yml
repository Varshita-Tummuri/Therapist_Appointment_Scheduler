
name: Therapist Appointment Scheduler CI

on:
  push:
    branches:
      - main
      - cicd-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend_AppointmentScheduler
    env:
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend_AppointmentScheduler/pom.xml

      - name: Build and verify backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Backend_AppointmentScheduler/target/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_AppointmentScheduler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend_AppointmentScheduler/package-lock.json

      - name: Install dependencies
        run: npm ci
      
      - name: Code quality check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend_AppointmentScheduler/dist
          if-no-files-found: error
